<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字列（string）型</title>
</head>
<body>
    <h1>文字列（string）型</h1>
    <script>
        //文字列型
        console.log('文字列型のデータ');

        //文字列の結合
        console.log('ようこそ、' + '山田' + 'さん');

        //特殊文字
        console.log('こんにちは\n\'JavaScript\'さん');
    </script>
</body>
</html>
