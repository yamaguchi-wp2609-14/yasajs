<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数値（number）型</title>
</head>
<body>
    <h1>数値（number）型</h1>
    <script>
        //数値型
        console.log(10);
        //console.log('10');
        //算術演算子
        console.log(10 + 5);
        console.log(11 - 3);
        console.log(11 * 2);
        console.log(9 / 3);
        console.log(10 % 4);

        //文字列を含む計算
        //console.log('hello' * 'JavaScript');
        console.log('hello' + 'JavaScript');
        console.log('3' + 2);
         console.log('3' * 2);
    </script>
</body>
</html>
