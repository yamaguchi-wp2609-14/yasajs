<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習1（自作関数）</title>
</head>

<body>
  <h1>練習1（自作関数）</h1>
  <script>
    // 指示どおりに関数を定義し、呼び出して、出力例と同じ文字列をコンソールに出力してください。
    // 文字列は + で連結してください。

    // 問1 関数の定義と呼び出し
    // 「こんにちは！」と出力する関数 hello() を定義し、2回呼び出してください。
      
   function hello(){
    console.log(`こんにちは！`)
    return;
   }
 hello()
 hello()


  
    // 【出力例】
    // こんにちは！
    // こんにちは！


    // 問2 引数
    // 商品名と値段を受け取り、「〇〇は△△円です」と出力する関数 showPrice() を定義し、呼び出してください。
    // 【出力例】
    // りんごは120円です
    // バナナは80円です
function showPrice(name,price){
  console.log(`${name}は${price}円です`);
  return;
}
showPrice(`りんご`,`120`);
showPrice(`バナナ`,`80`);


    // 問3 戻り値
    // 縦と横の長さを受け取り、長方形の面積を返す関数 getArea() を定義してください。
    // 関数の中では console.log() を使わず、戻り値を使って出力してください。
    // 【出力例】
    // 縦4、横5の長方形の面積は20です
    // 縦3、横7の長方形の面積は21です


    // 問4 デフォルト引数
    // 名前を受け取り、「こんにちは、〇〇さん」と出力する関数 greet() を定義してください。
    // 名前を渡さずに呼び出したときは「ゲスト」と表示されるようにしてください。
    // 【出力例】
    // こんにちは、田中さん
    // こんにちは、ゲストさん


    // 問5 まとめ
    // 値段と個数を受け取り、合計金額を返す関数 getTotal() を定義してください。
    // 個数を渡さずに呼び出したときは、個数を1として計算してください。
    // 1回目は値段120・個数3、2回目は値段80で個数を渡さずに呼び出してください。
    // 【出力例】
    // 合計は360円です
    // 合計は80円です

  </script>
</body>

</html>
