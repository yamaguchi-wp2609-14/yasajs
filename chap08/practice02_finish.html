<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習2（オブジェクトの配列：餃子FESメニュー）</title>
</head>

<body>
  <h1>練習2（オブジェクトの配列：餃子FESメニュー）</h1>

  <!-- 問8 -->
  <h2>問8</h2>
  <ul id="menu-list"></ul>

  <!-- 問9 -->
  <h2>問9</h2>
  <select id="allergen-select"></select>
  <button id="filter-button">除外して表示</button>
  <ul id="safe-list"></ul>

  <script>
    // 問1〜問7は、出力例と同じ文字列をコンソールに出力してください。
    // 問8・問9は、HTMLの要素を操作して、ブラウザの表示が【完成イメージ】のようになるようにしてください。
    // 変数やプロパティの値を含む文字列は、テンプレート文字列（`${}`）で作成してください。

    // 問1 メニューデータをオブジェクトの配列にする
    // menu-data.md の「メニュー一覧」と「プロパティのルール」を見て、5品のメニューをオブジェクトの配列にし、定数 menus に代入してください。
    // 個数が「なし」の商品は pieces を null に、アレルゲンが「なし」の商品は allergens を空の配列 [] にします。
    // 作れたら、商品の数と1番目の商品名を出力してください。
    // 【出力例】
    // メニューは全部で5品です
    // 1番目は肉汁あふれる焼き餃子です
    const menus = [
      {
        name: '肉汁あふれる焼き餃子',
        shop: '博多ぎょうざ堂',
        category: '餃子',
        pieces: 6,
        price: 580,
        allergens: ['小麦'],
      },
      {
        name: 'ぷりぷり海老蒸し餃子',
        shop: '中華食堂 蒸々屋',
        category: '餃子',
        pieces: 4,
        price: 580,
        allergens: ['えび', '小麦'],
      },
      {
        name: '手包み肉まん',
        shop: '中華食堂 蒸々屋',
        category: 'サイド',
        pieces: null,
        price: 350,
        allergens: ['小麦'],
      },
      {
        name: 'レモンチーズのデザート餃子',
        shop: 'Mediterraneo Gyoza',
        category: 'スイーツ',
        pieces: 3,
        price: 480,
        allergens: ['小麦', '乳'],
      },
      {
        name: '八女茶ソーダ',
        shop: '博多ぎょうざ堂',
        category: 'ドリンク',
        pieces: null,
        price: 350,
        allergens: [],
      },
    ];
    console.log(`メニューは全部で${menus.length}品です`);
    console.log(`1番目は${menus[0].name}です`);


    // 問2 オブジェクトの中の配列を取り出す
    // menus の2番目の商品について、アレルゲンの数と、アレルゲンの1つ目を出力してください。
    // 【出力例】
    // ぷりぷり海老蒸し餃子のアレルゲンは2つです
    // 1つ目はえびです
    console.log(`${menus[1].name}アレルゲンは${menus[1].allergens.length}つです`);
    console.log(`1つ目は${menus[1].allergens[0]}です`);


    // 問3 null かどうかで表示を変える
    // forEach() で商品名と価格を出力してください。
    // pieces が null ではない商品だけ、商品名のあとに「（○個入り）」を付けます。
    // 【出力例】
    // 肉汁あふれる焼き餃子（6個入り）：580円
    // ぷりぷり海老蒸し餃子（4個入り）：580円
    // 手包み肉まん：350円
    // レモンチーズのデザート餃子（3個入り）：480円
    // 八女茶ソーダ：350円
    menus.forEach((menu) => {
      if (menu.pieces !== null) {
        console.log(`${menu.name}（${menu.pieces}個入り）：${menu.price}円`);
      } else {
        console.log(`${menu.name}：${menu.price}円`);
      }
    });


    // 問4 配列を1つの文字列にする（join()）
    // forEach() で商品名とアレルゲンを出力してください。
    // 配列.join('・') と書くと、配列の要素を「・」でつないだ1つの文字列になります。
    // アレルゲンがない（allergens の要素数が0の）商品は「アレルゲンなし」と出力します。
    // 【出力例】
    // 肉汁あふれる焼き餃子：小麦
    // ぷりぷり海老蒸し餃子：えび・小麦
    // 手包み肉まん：小麦
    // レモンチーズのデザート餃子：小麦・乳
    // 八女茶ソーダ：アレルゲンなし
    console.log('<======== 問4 ========>');
    menus.forEach((menu) => {
      // console.log(menu.name,menu.allergens);
      if (menu.allergens.length === 0) {
        console.log(`${menu.name}：アレルゲンなし`);
      } else {
        console.log(`${menu.name}：${menu.allergens.join('・')}`);
      }
    });


    // 問5 配列に含まれているか調べる（includes()）
    // 「えび」を含む商品の名前を出力し、最後に、えびを含む商品の数を出力してください。
    // 配列.includes(値) は、配列にその値が含まれていれば true、含まれていなければ false になります。
    // 【出力例】
    // ぷりぷり海老蒸し餃子
    // えびを含む商品は1品です
    console.log('<======== 問5 ========>');
    let shrimpCount = 0;
    menus.forEach((menu) => {
      // console.log(menu.name,menu.allergens.includes('えび'));
      if (menu.allergens.includes('えび')) {
        console.log(menu.name);
        shrimpCount++;
      }
    });
    console.log(`えびを含む商品は${shrimpCount}品です`);

    // 問6 配列に含まれていないものを探す
    // 「乳」を含まない商品の名前を出力してください。
    // 【出力例】
    // 肉汁あふれる焼き餃子
    // ぷりぷり海老蒸し餃子
    // 手包み肉まん
    // 八女茶ソーダ
    console.log('<======== 問6 ========>');
    menus.forEach((menu) => {
      if (!menu.allergens.includes('乳')) {
        console.log(menu.name);
      }
    });

    // 問7 店名で絞り込んで合計する
    // 「博多ぎょうざ堂」の商品の名前と価格を出力し、最後に合計金額を出力してください。
    // 【出力例】
    // 肉汁あふれる焼き餃子：580円
    // 八女茶ソーダ：350円
    // 博多ぎょうざ堂の合計は930円です
    console.log('<======== 問7 ========>');
    let shopTotal = 0;
    menus.forEach((menu) => {
      // 条件はmenu.shopが「博多ぎょうざ堂」のとき
      if (menu.shop === '博多ぎょうざ堂') {
        console.log(`${menu.name}：${menu.price}円`);
        shopTotal += menu.price;
      }
    });
    console.log(`博多ぎょうざ堂の合計は${shopTotal}円です`);

    // 問8 メニューを一覧表示する
    // menus を、次の形で #menu-list に一覧表示してください。
    // 個数は問3と同じルールで付け、アレルゲンは問4と同じルールで表示します（ただし、ない場合は「なし」）。
    // 1件分ずつ変数 html に += でつなげ、最後に1回だけ innerHTML に入れます。
    //   <li>肉汁あふれる焼き餃子（6個入り） 580円／アレルゲン：小麦</li>
    // 【完成イメージ】
    // 肉汁あふれる焼き餃子（6個入り） 580円／アレルゲン：小麦
    // ぷりぷり海老蒸し餃子（4個入り） 580円／アレルゲン：えび・小麦
    // 手包み肉まん 350円／アレルゲン：小麦
    // レモンチーズのデザート餃子（3個入り） 480円／アレルゲン：小麦・乳
    // 八女茶ソーダ 350円／アレルゲン：なし
    console.log('<======== 問8 ========>');
    const menuList = document.querySelector('#menu-list');
    let html = '';
    menus.forEach((menu) => {
      let piecesText = '';
      let allergensText = 'なし';
      // piecesTextを作る
      if (menu.pieces !== null) {
        piecesText = `（${menu.pieces}個入り）`;
      }
      // allergensTextを作る
      if (menu.allergens.length > 0) {
        allergensText = `${menu.allergens.join('・')}`;
      }

      // li要素一個分のHTML文字列を作って書き足し
      // console.log(`<li>${menu.name}${piecesText} ${menu.price}円／アレルゲン：${allergensText}</li>`);
      html += `<li>${menu.name}${piecesText} ${menu.price}円／アレルゲン：${allergensText}</li>`;
    });
    menuList.innerHTML = html;

    // 問9 まとめ
    // 次の配列の要素ごとに option 要素を createElement() で作り、#allergen-select に append() してください。
    const allergenList = ['えび', 'かに', 'くるみ', '小麦', 'そば', '卵', '乳', '落花生'];
    // 「除外して表示」ボタン（#filter-button）を押したら、セレクトボックスで選んだアレルゲンを含まない商品の名前を、
    // #safe-list に li で一覧表示してください。
    // ボタンを押すたびに、前の表示は消えて新しい結果だけが表示されるようにします。
    // 【完成イメージ】
    // 「乳」を選んで押すと「肉汁あふれる焼き餃子」「ぷりぷり海老蒸し餃子」「手包み肉まん」「八女茶ソーダ」が表示される
    // 「小麦」を選んで押すと「八女茶ソーダ」だけが表示される
    console.log('<======== 問9 ========>');

    // 1.セレクトボックス
    const allergenSelect = document.querySelector('#allergen-select');
    allergenList.forEach((item) => {
      // console.log(item);
      // option要素作る
      const optionElm = document.createElement('option');
      // option要素のテキストを入れる
      optionElm.textContent = item;
      // option要素のvalue属性を設定する
      optionElm.value = item;
      // console.log(optionElm);
      // allergenSelectにappend()する
      allergenSelect.append(optionElm);
    });

    // 2.フィルタリング
    const fliterBtn = document.querySelector('#filter-button');
    const safeList = document.querySelector('#safe-list');
    fliterBtn.addEventListener('click', () => {
      // どの選択肢が選ばれているか取得
      const selected = allergenSelect.value;
      console.log(selected);
      // 選択されているアレルゲンを含まないメニューのみ取り出す
      let safeHtml = '';
      menus.forEach((menu)=>{
        if(!menu.allergens.includes(selected)){
          // console.log(menu.name);
          safeHtml += `<li>${menu.name}</li>`;
        }
      });
      // HTML作る
      safeList.innerHTML = safeHtml;
    });

  </script>
</body>

</html>
